<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>প্রশ্নভান্ডার – MCQ Practice & Mock Test</title>
<meta name="description" content="সংগ্রহ → বিষয় → এক্সাম সেট। টেস্ট দিন, সাথে সাথে স্কোর দেখুন।">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --primary:#2563eb;--primary-h:#1d4ed8;--bg:#f1f5f9;--card:#fff;--text:#1e293b;--muted:#64748b;--line:#e2e8f0;
  --ok-bg:#d1fae5;--ok:#10b981;--ok-t:#065f46;--bad-bg:#fee2e2;--bad:#ef4444;--bad-t:#991b1b;--warn:#f59e0b;
  --head:#1e293b;
}
[data-theme="dark"]{
  --bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--line:#334155;
  --ok-bg:#064e3b;--ok-t:#a7f3d0;--bad-bg:#7f1d1d;--bad-t:#fecaca;--head:#020617;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hind Siliguri','SolaimanLipi','Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
.topbar{background:var(--head);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;position:sticky;top:0;z-index:50}
.brand{font-weight:700;font-size:19px}
.topbar nav{display:flex;gap:16px;align-items:center}
.topbar nav a{opacity:.85;font-size:15px}.topbar nav a:hover{opacity:1}
#themeBtn{background:none;border:1px solid #475569;color:#fff;border-radius:6px;padding:3px 8px;cursor:pointer}
.wrap{max-width:980px;width:100%;margin:0 auto;padding:22px 16px;flex:1}
.foot{text-align:center;color:var(--muted);font-size:13px;padding:18px}
.muted{color:var(--muted)}
h2.title{font-size:24px;margin-bottom:4px}
.crumbs{font-size:14px;color:var(--muted);margin-bottom:14px}
.crumbs a{color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 2px 6px rgba(0,0,0,.04);transition:.15s;display:block}
a.card:hover{transform:translateY(-3px);border-color:var(--primary);box-shadow:0 8px 18px rgba(37,99,235,.12)}
.card .icon{font-size:30px}
.card h3{font-size:18px;margin:6px 0 2px}
.card p{font-size:14px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted);margin-top:8px;margin-right:4px}
.badge.done{background:var(--ok-bg);color:var(--ok-t);border-color:var(--ok)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:10px}
.setrow h3{font-size:16px}
.setrow .meta{font-size:13px;color:var(--muted)}
.btn{background:var(--primary);color:#fff;border:0;padding:9px 18px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{background:var(--primary-h)}
.btn.ghost{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
.btn.gray{background:#64748b}
.btn.sm{padding:6px 12px;font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.search{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--text);margin-top:12px}

/* Exam */
.exam-head{background:var(--head);color:#fff;border-radius:12px 12px 0 0;padding:16px 20px;text-align:center}
.exam-head h1{font-size:19px}
.exam-meta{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:13px;color:#94a3b8;margin-top:4px}
.sticky{position:sticky;top:48px;z-index:40;background:var(--card);border:1px solid var(--line);border-top:0;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.timer{font-weight:700;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.pbar{height:7px;background:var(--line)}
.pbar>div{height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#10b981);transition:width .3s}
.qbody{background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:18px}
.q{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px;background:var(--card)}
.q-title{font-weight:600;margin-bottom:10px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}
.opt{display:flex;align-items:center;gap:10px;padding:10px 13px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer;background:var(--bg);transition:.12s}
.opt:hover{border-color:#94a3b8}
.opt input{accent-color:var(--primary)}
.opt.sel{border-color:var(--primary);background:rgba(37,99,235,.1)}
.opt.ok{background:var(--ok-bg)!important;border-color:var(--ok)!important;color:var(--ok-t)!important;font-weight:600}
.opt.bad{background:var(--bad-bg)!important;border-color:var(--bad)!important;color:var(--bad-t)!important;font-weight:600}
.opt.flash{animation:shake .3s}
.opt.locked{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.expl{margin-top:10px;font-size:14px;padding:9px 12px;border-left:4px solid var(--warn);background:rgba(245,158,11,.1);border-radius:4px}
.palette{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:18px}
.palette h4{text-align:center;margin-bottom:10px;font-size:15px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:7px;max-height:230px;overflow:auto}
.pb{height:36px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:6px;font:inherit;font-weight:600;font-size:13px;cursor:pointer}
.pb.ans{background:var(--primary);color:#fff;border-color:var(--primary)}
.pb.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.pb.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.pb.mark{outline:2px solid var(--warn)}
.flag{background:none;border:0;cursor:pointer;font-size:16px;float:right;opacity:.5}
.flag.on{opacity:1}
.submit{text-align:center;margin-top:20px}

/* Result */
.score-big{font-size:46px;font-weight:800;color:var(--primary);text-align:center;margin:6px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--bg);border-radius:10px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px}
.stat.g b{color:var(--ok)}.stat.r b{color:var(--bad)}.stat.y b{color:var(--warn)}
table.t{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;font-size:14px;margin-top:12px}
table.t th{background:var(--head);color:#fff;text-align:left;padding:9px 10px}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.7);display:flex;justify-content:center;align-items:center;z-index:200;padding:14px}
.modal[hidden]{display:none}
.modal-box{background:var(--card);padding:26px;border-radius:14px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
@media(max-width:560px){.wrap{padding:14px 10px}.opts{grid-template-columns:1fr}.score-big{font-size:38px}}
@media print{.topbar,.foot,.btns,.palette,.sticky{display:none}}

/* ===== v2 additions ===== */
:root{--fs:16px}
.nbadge{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:3px}
.hero{background:linear-gradient(135deg,#0f172a,#1e3a8a 60%,#4338ca);color:#fff;border-radius:16px;padding:26px 20px;text-align:center;margin-bottom:16px;box-shadow:0 10px 25px rgba(30,58,138,.25)}
.hero h2{font-size:26px}.hero p{opacity:.85;font-size:14px;max-width:520px;margin:6px auto 0}
.wrongbanner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:rgba(245,158,11,.12);border:1.5px solid var(--warn);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.btn.warn{background:var(--warn);color:#1e293b}.btn.warn:hover{background:#d97706;color:#fff}
.badge.bad{background:var(--bad-bg);color:var(--bad-t);border-color:var(--bad)}
.small{font-size:13px}
/* accordion */
.acc{margin-top:14px;display:grid;gap:12px}
.acc-item{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.acc-head{width:100%;display:flex;align-items:center;gap:12px;padding:16px 18px;background:none;border:0;color:inherit;font:inherit;cursor:pointer;text-align:left}
.acc-head:hover{background:rgba(148,163,184,.1)}
.acc-head .ico{font-size:28px;background:rgba(37,99,235,.1);border-radius:12px;padding:6px 10px}
.acc-head .tx{flex:1;display:flex;flex-direction:column}
.acc-head .tx b{font-size:17px}.acc-head .tx small{color:var(--muted);font-size:13px}
.acc-head .arrow{color:var(--muted);transition:transform .3s;font-size:13px}
.acc-item.open .arrow{transform:rotate(180deg)}
.acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.acc-item.open .acc-body{grid-template-rows:1fr}
.acc-inner{overflow:hidden;background:rgba(148,163,184,.07)}
.acc-item.open .acc-inner{border-top:1px solid var(--line);padding:6px 16px 16px}
.sub h3{font-size:15px;margin:14px 0 8px}.sub h3 small{color:var(--muted);font-weight:400;margin-left:6px}
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.xcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.xcard:hover{border-color:var(--primary)}
.xcard h4{font-size:16px}.xcard .meta{font-size:12.5px;color:var(--muted)}
.xcard .btns{margin-top:auto}
/* exam */
.qbody{font-size:var(--fs)}
.tools{display:flex;gap:6px;align-items:center}
.ib{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:4px 9px;cursor:pointer;font:inherit;font-size:13px}
.qs.focus .q{display:none}.qs.focus .q.cur{display:block}
.q-title{font-size:1.06em;line-height:1.6}
.opt{font-size:1em;padding:12px 14px}
.opt .lb{font-weight:700;min-width:1.5em;color:var(--muted)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.nav[hidden]{display:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pulse{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.5)}50%{box-shadow:0 0 0 8px rgba(37,99,235,0)}}
.clr{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px;margin-top:8px}
.pb.now{outline:2px solid var(--primary)}
.pb.skip{background:var(--bg);color:var(--muted)}
.note{border-radius:8px;padding:8px 12px;font-size:14px;margin:6px 0}
.note.ok{background:var(--ok-bg);color:var(--ok-t)}.note.bad{background:var(--bad-bg);color:var(--bad-t)}
.score-big small{font-size:20px;color:var(--muted)}
.wq{border-top:1px dashed var(--line);padding:10px 0}
.wq .ca{color:var(--ok);font-weight:600;margin-top:4px}
.tw{overflow-x:auto}

/* ===== v3 additions ===== */
.hstat{margin-top:8px;font-size:13px!important;background:rgba(255,255,255,.12);display:inline-block;padding:3px 12px;border-radius:99px}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--muted);cursor:pointer}
.mixbar{margin:12px 0 4px;font-size:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mixlink{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 11px;border:1.5px solid var(--primary);color:var(--primary);border-radius:99px;margin-left:6px}
.mixlink:hover{background:var(--primary);color:#fff}
.warnbox{background:rgba(245,158,11,.12);border:1.5px solid var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.warnbox summary{cursor:pointer;font-weight:600}.warnbox ul{margin:8px 0 0 20px}
</style>
</head>

/* ---------- data loading (data/*.js → memory) ---------- */
const WARN = [];
const letterIdx = x => {
  const t = String(x).trim().toLowerCase().replace(/[()\s.]/g, '');
  const m = { 'ক': 0, 'খ': 1, 'গ': 2, 'ঘ': 3, 'ঙ': 4, a: 0, b: 1, c: 2, d: 3, e: 4, 1: 0, 2: 1, 3: 2, 4: 3, '১': 0, '২': 1, '৩': 2, '৪': 3 };
  return t in m ? m[t] : -1;
};
const loadScript = src => new Promise(res => {
  const el = document.createElement('script');
  el.src = src + '?t=' + Date.now();
  el.onload = () => res(true); el.onerror = () => res(false);
  document.head.appendChild(el);

function normQ(q, where) {
  let o = q.o || q.options;
  if (o && !Array.isArray(o)) o = ['a', 'b', 'c', 'd', 'e'].filter(k => k in o).map(k => o[k]);
  let a = q.a ?? q.ans;
  if (typeof a === 'string') a = letterIdx(a);
  if (!q.q || !o || o.length < 2 || !Number.isInteger(a) || a < 0 || a >= o.length) {
    WARN.push(`${where}: প্রশ্ন/অপশন/উত্তর ঠিক নেই`); return null;
  }
  return { q: String(q.q).trim(), o: o.map(x => String(x).trim()), a, e: String(q.e || q.explain || '').trim() };
}
/* সাধারণ লেখা (পেস্ট করা MCQ) → প্রশ্নের তালিকা */
function parseText(text, where) {
  const out = []; let cur = null, mode = 'q', seq = 0;
  const reQ = /^\s*([0-9০-৯]+)\s*[.)।:\-–]\s*(.*)$/;
  const reO = /^\s*\(?([কখগঘঙ]|[a-eA-E])\s*[).।:]\s*(.*)$/;
  const reA = /^\s*(?:উত্তর|উঃ|সঠিক\s*উত্তর|সঠিক|ans(?:wer)?)\s*[:：\-–=]\s*\(?\s*([কখগঘঙ]|[a-eA-E]|[1-4১-৪])\s*\)?(?![ঀ-৿\w])/i;
  const reE = /^\s*(?:ব্যাখ্যা|exp(?:lanation)?|note)\s*[:：\-–]\s*(.*)$/i;
  const flush = () => {
    if (!cur) return;
    if (!cur.q.trim() || cur.o.length < 2) WARN.push(`${where}: প্রশ্ন ${bn(cur.n)} — অপশন কম বা প্রশ্ন ফাঁকা`);
    else if (cur.a < 0 || cur.a >= cur.o.length) WARN.push(`${where}: প্রশ্ন ${bn(cur.n)} — "উত্তর:" পাওয়া যায়নি বা ভুল`);
    else out.push({ q: cur.q.trim(), o: cur.o, a: cur.a, e: cur.e.trim() });
    cur = null;
  };
  const start = q => { flush(); cur = { n: ++seq, q, o: [], a: -1, e: '' }; mode = 'q'; };
  String(text).split(/\r?\n/).forEach(raw => {
    const line = raw.trim(); if (!line) return;
    let m;
    if ((m = line.match(reA))) { if (cur) { cur.a = letterIdx(m[1]); mode = 'a'; } return; }
    if ((m = line.match(reE))) { if (cur) { cur.e = m[1]; mode = 'e'; } return; }
    if ((m = line.match(reQ))) { start(m[2]); return; }
    if (cur && mode !== 'e' && mode !== 'a' && (m = line.match(reO))) { cur.o.push(m[2]); mode = 'o'; return; }
    if (!cur || mode === 'a') { start(line); return; }          // নম্বর ছাড়া নতুন প্রশ্ন
    if (mode === 'q') cur.q += ' ' + line;
    else if (mode === 'o') cur.o[cur.o.length - 1] += ' ' + line;
    else if (mode === 'e') cur.e += ' ' + line;
  });
  flush();
  return out;
}
function normalize() {
  const sets = PB._sets || {};
  const cols = PB.collections.map(c => ({
    id: c.id, icon: c.icon, title: c.title, desc: c.desc,
    subsections: (c.subs || []).map(sub => {
      const seen = new Set(), list = [];
      (sets[c.id]?.[sub.id] || []).forEach((r, i) => {
        const lid = String(r.id || ('s' + (i + 1)));
        const where = `${c.title} › ${sub.title} › ${r.title || lid}`;
        if (seen.has(lid)) WARN.push(`${where}: id "${lid}" একই সাবসেকশনে দুইবার আছে`);
        seen.add(lid);
        let qs = (r.questions || []).map((q, j) => normQ(q, `${where} প্রশ্ন ${bn(j + 1)}`)).filter(Boolean);
        if (r.text) qs = qs.concat(parseText(r.text, where));
        if (!qs.length) { WARN.push(`${where}: কোনো প্রশ্ন পাওয়া যায়নি`); return; }
        const title = r.title || lid, negative = r.negative ?? 0.5, duration = r.duration ?? 0;
        list.push({ id: `${c.id}.${sub.id}.${lid}`, title, questions: qs.length, duration, negative,
          data: { title, negative, duration, questions: qs } });
      });
      return { id: sub.id, title: sub.title, icon: sub.icon, desc: sub.desc, sets: list };
    })
  }));
  Object.keys(sets).forEach(cid => {
    const c = PB.collections.find(x => x.id === cid);
    if (!c) return WARN.push(`data ফাইলে "${cid}" নামে কালেকশন index.js এ নেই`);
    Object.keys(sets[cid]).forEach(sid => { if (!(c.subs || []).some(x => x.id === sid)) WARN.push(`${c.title}: "${sid}" নামে সাবসেকশন index.js এ নেই`); });
  });
  return { siteTitle: PB.site?.title, tagline: PB.site?.tagline, collections: cols };
}
async function loadAll() {
  if (!window.__PB_PRELOADED) {
    await loadScript('data/index.js');
    if (!window.PB || !PB.collections) throw new Error('data/index.js লোড হয়নি');

}
const shuf = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const FIXED = /উপরের|সবগুলো|কোনোটিই|কোনটিই|none of|all of the above|both/i;
function shuffleQ(q) {
  if (q.o.some(x => FIXED.test(x))) return q;
  const order = shuf(q.o.map((_, i) => i));
  return { ...q, o: order.map(i => q.o[i]), a: order.indexOf(q.a) };
}
const crumbs = parts => `<div class="crumbs">${parts.map(p => p.h ? `<a href="${p.h}">${esc(p.t)}</a>` : esc(p.t)).join(' › ')}</div>`;
const countSets = c => c.subsections.reduce((n, s) => n + s.sets.length, 0);

}

  try {

    if (!seg.length) return await viewHome();
    if (seg[0] === 'c' && seg[1] && !seg[2]) return await viewCollection(seg[1]);
    if (seg[0] === 'c' && seg[2] === 's' && seg[3]) return await viewSubsection(seg[1], seg[3]);

    a.download = 'proshnobhandar-backup-' + new Date().toISOString().slice(0, 10) + '.json'; a.click();
  };
  document.getElementById('rs').onchange = async e => {
    try {
      const d = JSON.parse(await e.target.files[0].text());
      const seen = new Set(getResults().map(r => r.at));
      lsSet(K_RES, [...getResults(), ...(d.results || []).filter(r => !seen.has(r.at))].sort((a, b) => b.at - a.at).slice(0, 300));
      const W = getWrong();
      Object.entries(d.wrong || {}).forEach(([k, v]) => { if (!W[k] || W[k].times < v.times) W[k] = v; });
      lsSet(K_WRONG, W); updateWrongBadge(); alert('ব্যাকআপ ফেরত এসেছে ✔'); viewHistory();
    } catch { alert('ফাইলটি পড়া যায়নি'); }
  };
  const b = document.getElementById('clr');
  if (b) b.onclick = () => { if (confirm('সব ফলাফল মুছে ফেলবেন?')) { lsSet(K_RES, []); viewHistory(); } };
}

/* ---------- paper builder ---------- */
async function buildPaper(setId, onlyWrong) {
  if (setId === 'retake') {
    const bySet = {};
    Object.values(getWrong()).forEach(w => (bySet[w.setId] ||= []).push(w));
    const qs = [];
    for (const id of Object.keys(bySet)) {
      const meta = findSet(id); if (!meta) continue;
      const data = meta.st.data;
      bySet[id].sort((a, b) => a.idx - b.idx).forEach(w => data.questions[w.idx] &&
        qs.push({ ...data.questions[w.idx], setId: id, idx: w.idx }));
    }
    if (!qs.length) throw new Error('ভুল প্রশ্নের তালিকা খালি – সবগুলো ঠিক হয়ে গেছে 🎉');
    const fin = prefs().shuffle ? shuf(qs).map(shuffleQ) : qs;
    return { saveId: 'retake', title: 'ভুল প্রশ্নের পুনরায় পরীক্ষা', neg: 0.5, duration: 0, qs: fin, trail: [{ t: 'ভুলের খাতা', h: '#/wrong' }, { t: 'পুনরায় পরীক্ষা' }], meta: null };
  }
  const meta = findSet(setId);
  if (!meta) throw new Error('সেট পাওয়া যায়নি');
  const data = meta.st.data;
  let qs = data.questions.map((q, idx) => ({ ...q, setId, idx }));
  const total = qs.length;
  if (onlyWrong) {
    const bad = new Set(wrongOfSet(setId).map(w => w.idx));
    qs = qs.filter(q => bad.has(q.idx));
    if (!qs.length) throw new Error('এই সেটে কোনো ভুল প্রশ্ন জমা নেই 🎉');
  }
  if (prefs().shuffle) qs = shuf(qs).map(shuffleQ);
  const dur = (data.duration ?? meta.st.duration ?? 0);
  return {
    saveId: onlyWrong ? setId + ':wrong' : setId,
    title: (data.title || meta.st.title) + (onlyWrong ? ' – ভুলগুলো' : ''),
    neg: data.negative ?? meta.st.negative ?? 0.5,
    duration: onlyWrong ? 0 : dur * 60,
    qs, meta,
    trail: [{ t: meta.c.title, h: '#/' }, { t: meta.s.title, h: '#/' }, { t: meta.st.title }]
  };
}

async function buildMix(cid, sid, n) {
  const c = INDEX.collections.find(x => x.id === cid);
  if (!c) throw new Error('কালেকশন পাওয়া যায়নি');
  const subs = sid ? c.subsections.filter(x => x.id === sid) : c.subsections;
  const pool = [];
  subs.forEach(sb => sb.sets.forEach(st => st.data.questions.forEach((q, idx) => pool.push({ ...q, setId: st.id, idx }))));
  if (!pool.length) throw new Error('এখানে এখনো কোনো প্রশ্ন যোগ হয়নি');
  let qs = shuf(pool).slice(0, n);
  if (prefs().shuffle) qs = qs.map(shuffleQ);
  return {
    saveId: 'mix:' + cid + (sid ? '.' + sid : ''), neg: 0.5, duration: qs.length * 40, qs, meta: null,
    title: `🎲 র‍্যান্ডম মিক্স – ${c.title}${sid && subs[0] ? ' › ' + subs[0].title : ''}`,
    trail: [{ t: c.title, h: '#/' }, { t: 'র‍্যান্ডম মিক্স' }]
  };
}

/* ---------- exam ---------- */
async function viewExam(setId, mode, onlyWrong, opts = {}) {
  const paper = await (opts.paper || buildPaper(setId, onlyWrong));
  const Q = paper.qs, total = Q.length, neg = paper.neg, full = total;
  const isExam = mode === 'exam';
  const P = prefs();
  const ans = {}, flagged = new Set();
  let finished = false, left = paper.duration, cur = 0, view = P.view;
  document.documentElement.style.setProperty('--fs', P.fs + 'px');

  $app.innerHTML = `
    ${crumbs([{ t: 'হোম', h: '#/' }, ...paper.trail])}
    <div class="exam-head">
      <h1>${esc(paper.title)}</h1>
      <div class="exam-meta"><span>${isExam ? '🧪 পরীক্ষা মোড' : '📖 প্র্যাকটিস মোড'}</span><span>পূর্ণমান: ${bn(full)}</span><span>প্রশ্ন: ${bn(total)}</span><span>নেগেটিভ: ${fmt(neg)}</span></div>
    </div>
    <div class="sticky">
      <span>উত্তর: <b id="cnt">${bn(0)}</b>/${bn(total)}</span>
      ${isExam && paper.duration ? `<span class="timer" id="tm">⏱ ${mmss(left)}</span>` : ''}
      <span class="tools">
        <button class="ib" id="fsM" title="ছোট">A−</button><button class="ib" id="fsP" title="বড়">A+</button>
        <button class="ib" id="vw" title="ভিউ বদল"></button>
        <button class="btn sm" id="subTop">সাবমিট</button>
      </span>
    </div>
    <div class="pbar"><div id="pb"></div></div>
    <div class="qbody">
      <div id="qs" class="qs">
        ${Q.map((q, i) => `
          <div class="q" id="q${i}">
            <button class="flag" data-f="${i}" title="পরে দেখব">🚩</button>
            <div class="q-title">${bn(i + 1)}. ${esc(q.q)}</div>
            <div class="opts">
              ${q.o.map((o, k) => `
                <label class="opt" id="o${i}_${k}">
                  <input type="radio" name="q${i}" value="${k}">
                  <span class="lb">${LABELS[k]}</span><span>${esc(o)}</span>
                </label>`).join('')}
            </div>
            ${isExam ? `<button class="clr" data-c="${i}" hidden>উত্তর মুছুন</button>` : ''}
            <div class="expl" id="e${i}" hidden></div>
          </div>`).join('')}
      </div>
      <div class="nav" id="nav">
        <button class="btn ghost" id="prev">← আগের</button>
        <span class="muted small" id="pos"></span>
        <button class="btn" id="next">পরের →</button>
      </div>
      <div class="palette"><h4>প্রশ্ন গ্রিড <span class="muted small">(কিবোর্ড: ১–৪ বা a–d উত্তর, ← → নেভিগেশন)</span></h4>
        <div class="pgrid">${Q.map((_, i) => `<button class="pb" id="p${i}" data-g="${i}">${bn(i + 1)}</button>`).join('')}</div>
      </div>
      <div class="submit"><button class="btn" id="subBtn">${isExam ? 'পরীক্ষা সাবমিট করুন' : 'শেষ করে ফলাফল দেখুন'}</button></div>
    </div>`;

  const $ = id => document.getElementById(id);
  const qs = $('qs');

  /* view helpers */
  function applyView() {
    qs.classList.toggle('focus', view === 'focus' && !finished);
    $('nav').hidden = !(view === 'focus' && !finished);
    $('vw').textContent = view === 'focus' ? '☰ সব একসাথে' : '▭ একটা একটা';
    Q.forEach((_, i) => $('q' + i).classList.toggle('cur', i === cur));
    $('pos').textContent = `${bn(cur + 1)} / ${bn(total)}`;
    $('prev').disabled = cur === 0;
    $('next').disabled = cur === total - 1;
    document.querySelectorAll('.pb').forEach((b, i) => b.classList.toggle('now', view === 'focus' && !finished && i === cur));
  }
  function go(i) {
    cur = Math.max(0, Math.min(total - 1, i));
    applyView();
    if (view === 'focus' && !finished) window.scrollTo({ top: qs.getBoundingClientRect().top + scrollY - 120, behavior: 'smooth' });
    else $('q' + cur).scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function upd() {
    const n = Object.keys(ans).length;
    $('cnt').textContent = bn(n);
    $('pb').style.width = (n / total * 100) + '%';
  }
  function showExpl(i) {
    if (!Q[i].e) return;
    const el = $('e' + i); el.hidden = false; el.textContent = '💡 ' + Q[i].e;
  }

  /* answering */
  function choose(i, k) {
    if (finished) return;
    if (!isExam && ans[i] !== undefined) return;
    ans[i] = k;
    const p = $('p' + i);
    document.querySelectorAll(`#q${i} .opt`).forEach(l => l.classList.remove('sel'));
    $(`o${i}_${k}`).classList.add('sel');
    $(`o${i}_${k}`).querySelector('input').checked = true;
    p.classList.add('ans');
    if (isExam) { const c = document.querySelector(`[data-c="${i}"]`); if (c) c.hidden = false; }
    if (!isExam) {                               // সাথে সাথে ফিডব্যাক
      const c = Q[i].a;
      document.querySelectorAll(`input[name=q${i}]`).forEach(r => r.disabled = true);
      document.querySelectorAll(`#q${i} .opt`).forEach(l => l.classList.add('locked'));
      $(`o${i}_${c}`).classList.add('ok');
      p.classList.remove('ans');
      if (k === c) p.classList.add('ok');
      else { $(`o${i}_${k}`).classList.add('bad', 'flash'); p.classList.add('bad'); }
      showExpl(i);
      if (view === 'focus' && i < total - 1) $('next').classList.add('pulse');
    }
    upd();
  }
  const onChange = e => {
    if (!e.target.matches('input[type=radio]')) return;
    choose(+e.target.name.slice(1), +e.target.value);
  };
  $app.addEventListener('change', onChange);

  const onKey = e => {
    if (e.ctrlKey || e.metaKey || e.altKey || /INPUT|TEXTAREA/.test(e.target.tagName) && e.target.type !== 'radio') return;
    if (!$('modal').hidden) return;
    const k = e.key.toLowerCase();
    if (e.key === 'ArrowRight' || k === 'n') { go(cur + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || k === 'p') { go(cur - 1); e.preventDefault(); }
    else if (!finished && view === 'focus') {
      const idx = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'abcd'.indexOf(k);
      if (k.length === 1 && idx >= 0) { choose(cur, idx); e.preventDefault(); }
      else if (e.key === 'Enter' && !isExam && ans[cur] !== undefined) go(cur + 1);
    }
  };
  document.addEventListener('keydown', onKey);
  window.__cleanup = () => {
    $app.removeEventListener('change', onChange);
    document.removeEventListener('keydown', onKey);
  };

  /* buttons */
  $('prev').onclick = () => { $('next').classList.remove('pulse'); go(cur - 1); };
  $('next').onclick = () => { $('next').classList.remove('pulse'); go(cur + 1); };
  $('vw').onclick = () => { view = view === 'focus' ? 'list' : 'focus'; setPref('view', view); applyView(); go(cur); };
  $('fsP').onclick = () => { const n = Math.min(24, prefs().fs + 2); setPref('fs', n); document.documentElement.style.setProperty('--fs', n + 'px'); };
  $('fsM').onclick = () => { const n = Math.max(13, prefs().fs - 2); setPref('fs', n); document.documentElement.style.setProperty('--fs', n + 'px'); };
  document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => go(+b.dataset.g));
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
    const i = +b.dataset.f;
    flagged.has(i) ? flagged.delete(i) : flagged.add(i);
    b.classList.toggle('on', flagged.has(i));
    $('p' + i).classList.toggle('mark', flagged.has(i));
  });
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
    const i = +b.dataset.c; delete ans[i];
    document.querySelectorAll(`input[name=q${i}]`).forEach(r => r.checked = false);
    document.querySelectorAll(`#q${i} .opt`).forEach(l => l.classList.remove('sel'));
    $('p' + i).classList.remove('ans'); b.hidden = true; upd();
  });
  const submit = auto => {
    if (finished) return;
    const un = total - Object.keys(ans).length;
    if (!auto && un && !confirm(`${bn(un)} টি প্রশ্নের উত্তর দেওয়া হয়নি। সাবমিট করবেন?`)) return;
    finish();
  };
  $('subBtn').onclick = $('subTop').onclick = () => submit(false);

  if (isExam && paper.duration) {
    timerId = setInterval(() => {
      left--;
      const t = $('tm'); if (!t) return clearInterval(timerId);
      t.textContent = '⏱ ' + mmss(Math.max(left, 0));
      t.classList.toggle('low', left <= 60);
      if (left <= 0) { clearInterval(timerId); alert('সময় শেষ! পরীক্ষা জমা হচ্ছে।'); submit(true); }
    }, 1000);
  }

  /* finish + ভুলের খাতা আপডেট */
  function finish() {
    finished = true; clearInterval(timerId);
    let correct = 0, wrong = 0, fixed = 0, newWrong = 0;
    const W = getWrong();
    Q.forEach((q, i) => {
      if (ans[i] === undefined) return;
      const key = q.setId + '#' + q.idx;
      if (ans[i] === q.a) {
        correct++;
        if (W[key]) { delete W[key]; fixed++; }          // ঠিক হলে খাতা থেকে বাদ
      } else {
        wrong++;
        if (W[key]) { W[key].times++; W[key].at = Date.now(); }
        else { W[key] = { setId: q.setId, idx: q.idx, times: 1, at: Date.now() }; newWrong++; }
      }
    });
    lsSet(K_WRONG, W); updateWrongBadge();
    const score = correct - wrong * neg, unans = total - correct - wrong;
    saveResult({ setId: paper.saveId, title: paper.title, mode, at: Date.now(), correct, wrong, unans, score, full });

    Q.forEach((q, i) => {
      document.querySelectorAll(`input[name=q${i}]`).forEach(r => r.disabled = true);
      document.querySelectorAll(`#q${i} .opt`).forEach(l => l.classList.add('locked', 'rv'));
      $(`o${i}_${q.a}`).classList.add('ok');
      const p = $('p' + i); p.classList.remove('ans');
      if (ans[i] === undefined) p.classList.add('skip');
      else if (ans[i] === q.a) p.classList.add('ok');
      else { $(`o${i}_${ans[i]}`).classList.add('bad'); p.classList.add('bad'); }
      showExpl(i);
    });
    document.querySelectorAll('.clr').forEach(b => b.hidden = true);
    upd(); applyView();

    const pct = Math.max(0, score / full * 100);
    const grade = pct >= 80 ? '🏆 চমৎকার!' : pct >= 60 ? '👍 ভালো হয়েছে' : pct >= 40 ? '🙂 আরও অনুশীলন দরকার' : '📚 আবার চেষ্টা করুন';
    const nx = paper.meta ? nextSet(setId) : null;
    const wl = paper.meta ? wrongOfSet(setId).length : wrongCount();
    const retry = paper.meta ? `#/exam/${setId}?only=wrong` : '#/retake';
    $('modalBox').innerHTML = `
      <h3 style="text-align:center">পরীক্ষার ফলাফল</h3>
      <div class="score-big">${fmt(score)} <small>/ ${bn(full)}</small></div>
      <p style="text-align:center">${grade} (${bn(Math.round(pct))}%)</p>
      <div class="stats">
        <div class="stat"><b>${bn(correct + wrong)}</b>উত্তর দিয়েছেন</div>
        <div class="stat g"><b>${bn(correct)}</b>সঠিক</div>
        <div class="stat r"><b>${bn(wrong)}</b>ভুল (−${fmt(wrong * neg)})</div>
        <div class="stat y"><b>${bn(unans)}</b>উত্তরহীন</div>
      </div>
      ${fixed ? `<p class="note ok">🎉 ${bn(fixed)} টি আগের ভুল এবার ঠিক হয়েছে — ভুলের খাতা থেকে বাদ গেছে।</p>` : ''}
      ${newWrong ? `<p class="note bad">📝 ${bn(newWrong)} টি নতুন ভুল ভুলের খাতায় জমা হয়েছে।</p>` : ''}
      <div class="btns" style="justify-content:center;margin-top:12px">
        ${wl ? `<a class="btn warn" href="${retry}">❌ ভুলগুলো আবার দিন (${bn(wl)})</a>` : ''}
        <button class="btn ghost sm" id="rv">উত্তর রিভিউ</button>
        ${paper.meta && !onlyWrong ? `<button class="btn ghost sm" id="again">আবার দিন</button>` : ''}
        ${nx ? `<a class="btn sm" href="#/exam/${nx.id}">পরের সেট →</a>` : `<a class="btn sm" href="#/">হোম</a>`}
      </div>`;
    const m = $('modal'); m.hidden = false;
    const ag = $('again'); if (ag) ag.onclick = () => route();
    $('rv').onclick = () => { m.hidden = true; window.scrollTo({ top: 0, behavior: 'smooth' }); };
    m.onclick = e => { if (e.target === m) m.hidden = true; };
  }

  applyView();
}
</script>
